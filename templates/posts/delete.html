{% extends 'base.html' %}

{% block title %}
    Delete Post
{% endblock %}

{% block content %}
    <h1>Delete Post #{{post.id}}</h1>
    <p>Are you want to delete <strong>"{{ post.title }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Delete" class="btn btn-outline-danger">
    </form>
{% endblock %}
